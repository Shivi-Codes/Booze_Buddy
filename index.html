<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/main.js" defer></script>
    <title>Vite App</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid w-75 mx-auto">
        <a class="navbar-brand" href="/">Booze Buddy</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link active" aria-current="page" href="/">Home</a>
            <a class="nav-link" href="/src/pages/favourites.html">Favourites</a>
          </div>
        </div>
      </div>
    </nav>
    <main>
      <section>
        <div class="d-flex p-3 justify-content-center gap-5 w-75 mx-auto">
          <div
            class="d-flex flex-column justify-content-center align-items-center"
          >
            <h2>Sip Happens — We&apos;ve Got You</h2>
            <p>Turn basic bar stock into world-class cocktails in seconds.</p>
          </div>

          <img
            class="w-50 rounded mx-auto"
            class="img-fluid p-5"
            src="./src/assets/images/hero.jpg"
            alt=""
          />
        </div>
      </section>
      <section>
        <div class="d-flex p-3 justify-content-center gap-1 w-75 mx-auto">
          <div class="input-group w-75">
            <input
              id="search-input"
              type="text"
              aria-label="search"
              class="form-control"
            />
          </div>
          <button id="search-btn" type="button" class="btn btn-primary w-25">
            Search 🍸
          </button>
        </div>
      </section>
      <section>
        <div class="container scrollable">
          <div id="cocktail-grid" class="row g-4 d-none"></div>
        </div>
      </section>
    </main>
  </body>
</html>
